# XcodeGen spec. On a Mac:  brew install xcodegen && cd ios && xcodegen
# then open PDFDriveReader.xcodeproj
name: PDFDriveReader
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  PDFDriveReader:
    type: application
    platform: iOS
    sources:
      - path: PDFDriveReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pdfdrivereader   # change to your own, e.g. com.yourname.pdfdrivereader
        DEVELOPMENT_TEAM: ""                                     # or pick your team in Xcode → Signing & Capabilities
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: PDFDriveReader/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PDFDriveReader/PDFDriveReader.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
